alias: Bin night - reset completed bins after collection
description: >-
  Turns off a bin's "taken out" helper when its calendar collection event ends,
  ready for the next collection.
# Queue simultaneous collections so every bin's helper is reset.
mode: queued
triggers:
  - trigger: calendar
    entity_id: calendar.bin_night
    event: end
variables:
  # Keys must match calendar event titles and card titles exactly.
  helpers:
    General Waste: input_boolean.red_bin_out
    Recycling: input_boolean.recycling_bin_out
    Green Waste: input_boolean.green_bin_out
conditions:
  # Ignore unrelated calendar events (and runs without a calendar trigger).
  - condition: template
    value_template: >-
      {{ trigger is defined and trigger.calendar_event is defined
         and trigger.calendar_event.summary in helpers }}
actions:
  - action: input_boolean.turn_off
    target:
      entity_id: "{{ helpers[trigger.calendar_event.summary] }}"
