bin-night-card:
  default:
    - title: Bin
    - icon: mdi:trash-can
    - color: "var(--ha-card-background,var(--card-background-color,white))"
    - text_color: "var(--primary-text-color)"
    - show_title: false
    - completion_entity: ""
    - completion_style: background
    - completed_color: "#777777"
    - completed_icon_color: "var(--secondary-text-color)"
    - completed_label: Taken out

  card:
    type: custom:button-card

    entity: |
      [[[
        return '[[completion_entity]]' || 'sensor.bin_night_schedule';
      ]]]

    variables:
      # The next collection for this bin type
      event: |
        [[[
          const schedule =
            states['sensor.bin_night_schedule']?.attributes?.next_by_type || {};

          return schedule['[[title]]'] || null;
        ]]]

      # Collection has started, but its return deadline hasn't passed
      bringing_in: |
        [[[
          const event = variables.event;
          if (!event) return false;

          const now = Date.now();

          return now >= new Date(event.start).getTime() &&
                now < new Date(event.end).getTime();
        ]]]

      # Bin has been marked as taken out
      completed: |
        [[[
          if (variables.bringing_in) return false;

          const id = '[[completion_entity]]';

          return !!id && states[id]?.state === 'on';
        ]]]

    show_icon: true
    show_name: true
    show_label: true
    show_state: false

    icon: "[[icon]]"
    name: "[[title]]"

    label: |
      [[[
        const event = variables.event;

        if (!event) return 'No collection';
        if (variables.bringing_in) return 'Bring in';
        if (variables.completed) return '[[completed_label]]';

        const start = new Date(event.start);
        const now = new Date();

        // Bin night is the day before collection
        const binNight = new Date(start);
        binNight.setDate(binNight.getDate() - 1);

        // Compare calendar dates without daylight-saving errors
        const days = Math.round((
          Date.UTC(
            binNight.getFullYear(),
            binNight.getMonth(),
            binNight.getDate()
          ) -
          Date.UTC(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
          )
        ) / 86400000);

        if (days === 0) return 'Tonight';
        if (days === 1) return 'Tomorrow';
        if (days < 0) return 'Collection today';

        if (days > 14) {
          return [
            String(binNight.getDate()).padStart(2, '0'),
            String(binNight.getMonth() + 1).padStart(2, '0')
          ].join('/');
        }

        return `In ${days} days`;
      ]]]

    tap_action: |
      [[[
        const id = '[[completion_entity]]';

        if (!id || !states[id] ||
            !variables.event || variables.bringing_in) {
          return { action: 'none' };
        }

        return {
          action: 'toggle',
          entity: id
        };
      ]]]

    hold_action:
      action: more-info
      entity: sensor.bin_night_schedule

    styles:
      card:
        - border: none
        - padding: 12px
        - background-color: |
            [[[
              const style = '[[completion_style]]';

              return variables.completed &&
                ['background', 'both'].includes(style)
                  ? '[[completed_color]]'
                  : '[[color]]';
            ]]]
        - color: "[[text_color]]"

      grid:
        - grid-template-areas: '"i" "n" "l"'
        - grid-template-rows: 1fr min-content min-content
        - row-gap: 8px

      icon:
        - width: 36px
        - color: |
            [[[
              const style = '[[completion_style]]';

              return variables.completed &&
                ['icon', 'both'].includes(style)
                  ? '[[completed_icon_color]]'
                  : '[[text_color]]';
            ]]]

      name:
        - display: |
            [[[
              return String('[[show_title]]') === 'true'
                ? 'block'
                : 'none';
            ]]]
        - font-size: 14px

      label:
        - font-size: 16px
        - font-weight: 600
