# Merge this mapping into the dashboard root (alongside views).

decluttering_templates:
  # Copy from below ---

  bin-night:
    default:
      - title: Bin
      - icon: ""
      - color: "#777777"
      - text_color: "#FFFFFF"
      - show_title: false
      - completion_style: background
      - completed_color: "#777777"
      - completed_icon_color: "#FFFFFF"
      - completed_label: Taken out

    card:
      type: custom:button-card
      entity: "[[completion_entity]]"

      show_icon: true
      show_name: true
      show_label: true

      icon: |
        [[[
          const custom = '[[icon]]';
          if (custom) return custom;
          return states['[[collection_entity]]']?.attributes?.icon
            || 'mdi:trash-can';
        ]]]
      name: "[[title]]"
      label: |
        [[[
          // Completion state: the helper is the single source of truth.
          const isCompleted = entity?.state === 'on';
          if (isCompleted) return '[[completed_label]]';

          // Collection date calculation.
          const collection = states['[[collection_entity]]']?.state;

          if (!collection || ['unknown', 'unavailable'].includes(collection)) {
            return 'Unknown';
          }

          // Parse collection date in local time.
          // Supports "on Tue, 13.10.2026" (DD.MM.YYYY) and ISO "2026-10-13".
          let year, month, day;
          const dmy = collection.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
          const iso = collection.match(/(\d{4})-(\d{2})-(\d{2})/);
          if (dmy) {
            [day, month, year] = dmy.slice(1).map(Number);
          } else if (iso) {
            [year, month, day] = iso.slice(1).map(Number);
          } else {
            return 'Unknown';
          }
          const binNight = new Date(year, month - 1, day);

          // Bins go out the night before collection.
          binNight.setDate(binNight.getDate() - 1);

          const today = new Date();

          // Compare calendar dates, avoiding daylight-saving errors.
          const days = Math.round(
            (
              Date.UTC(
                binNight.getFullYear(),
                binNight.getMonth(),
                binNight.getDate()
              ) -
              Date.UTC(
                today.getFullYear(),
                today.getMonth(),
                today.getDate()
              )
            ) / 86400000
          );

          if (days === 0) return 'Tonight';
          if (days === 1) return 'Tomorrow';
          if (days < 0) return 'Collection today';

          return `In ${days} nights`;
        ]]]

      triggers_update:
        - "[[completion_entity]]"
        - "[[collection_entity]]"

      tap_action:
        action: toggle

      hold_action:
        action: more-info

      styles:
        card:
          - border-radius: 0
          - border: none
          - padding: 16px
          - background-color: |
              [[[
                const isCompleted = entity?.state === 'on';
                const style = '[[completion_style]]';
                return isCompleted && ['background', 'both'].includes(style)
                  ? '[[completed_color]]'
                  : '[[color]]';
              ]]]
          - color: "[[text_color]]"

        grid:
          - grid-template-areas: '"i" "n" "l"'
          - grid-template-rows: 1fr min-content min-content
          - row-gap: 8px

        icon:
          - width: 36px
          - color: |
              [[[
                const isCompleted = entity?.state === 'on';
                const style = '[[completion_style]]';
                return isCompleted && ['icon', 'both'].includes(style)
                  ? '[[completed_icon_color]]'
                  : '[[text_color]]';
              ]]]

        name:
          - display: |
              [[[
                return String('[[show_title]]') === 'true'
                  ? 'block'
                  : 'none';
              ]]]
          - font-size: 14px

        label:
          - font-size: 16px
          - font-weight: 600
