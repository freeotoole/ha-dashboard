type: grid
columns: 3
square: false
cards:
  - type: custom:decluttering-card
    template: bin-night
    variables:
      - collection_entity: sensor.waste_collection_schedule_red_bin
      - title: General Waste
      - color: "#C0393B"
      - completion_entity: input_boolean.red_bin_out
  - type: custom:decluttering-card
    template: bin-night
    variables:
      - collection_entity: sensor.waste_collection_schedule_recycling
      - title: Recycling
      - color: "#FFE500"
      - text_color: "#111111"
      - completion_entity: input_boolean.recycling_bin_out
  - type: custom:decluttering-card
    template: bin-night
    variables:
      - collection_entity: sensor.waste_collection_schedule_green_bin
      - title: Green Waste
      # - icon: mdi:dump-truck
      - color: "#AAAAAA"
      - text_color: "#111111"
      - completion_entity: input_boolean.green_bin_out
