# Helpers + template sensors for coffee machine warm-up and cooling.
# Used by coffee-card.automations.yaml and coffee-card.yaml.

# merge with config nano /mnt/user/appdata/homeassistant/configuration.yaml

input_datetime:
  coffee_machine_last_off:
    name: Coffee machine last off
    has_date: true
    has_time: true
  coffee_machine_ready_at:
    name: Coffee machine ready at
    has_date: true
    has_time: true
  coffee_machine_started_at:
    name: Coffee machine started at
    has_date: true
    has_time: true

  # Coffee machine - regular template sensor - merge in
template:
  - sensor:
      - name: Coffee machine status
        unique_id: coffee_machine_status
        state: >-
          {% set ready_ts = state_attr('input_datetime.coffee_machine_ready_at', 'timestamp') | float(0) %}
          {% set now_ts = now().timestamp() %}
          {% if is_state('switch.coffee_machine', 'on') %}
            {{ 'ready' if now_ts >= ready_ts else 'heating' }}
          {% else %}
            {{ 'cooling' if now_ts < ready_ts else 'cold' }}
          {% endif %}
        icon: >-
          {{ 'mdi:thermometer-high' if this.state == 'ready'
             else 'mdi:thermometer-low' if this.state == 'cold'
             else 'mdi:thermometer' }}

      - name: Coffee machine progress
        unique_id: coffee_machine_progress
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% if is_state('switch.coffee_machine', 'on') %}
            {% set start = state_attr(
              'input_datetime.coffee_machine_started_at',
              'timestamp') | float(0) %}
          {% else %}
            {% set start = state_attr(
              'input_datetime.coffee_machine_last_off',
              'timestamp') | float(0) %}
          {% endif %}
          {% set ready = state_attr(
            'input_datetime.coffee_machine_ready_at',
            'timestamp') | float(0) %}
          {% set duration = ready - start %}
          {% if start <= 0 or ready <= 0 %}
            0
          {% elif duration <= 0 %}
            100
          {% else %}
            {{ ([0, (now().timestamp() - start)
              / duration * 100, 100] | sort)[1] | round(0) }}
          {% endif %}
