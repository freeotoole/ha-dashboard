type: custom:bubble-card
card_type: button
button_type: switch
entity: switch.coffee_machine
name: Lelit
icon: mdi:coffee-maker
force_icon: true
state_content: "{{ states('sensor.coffee_machine_status') | title }}"
scrolling_effect: false
tap_action:
  action: toggle
hold_action:
  action: more-info
grid_options:
  rows: 1
  columns: 8
styles: |
  ${(() => {
    const on = hass.states['switch.coffee_machine']?.state === 'on';
    const status = hass.states['sensor.coffee_machine_status']?.state;
    const progress = Number(hass.states['sensor.coffee_machine_progress']?.state ?? 0);
    const boundedProgress = Number.isFinite(progress)
      ? Math.min(100, Math.max(0, progress))
      : 0;
    const fill = on
      ? boundedProgress
      : status === 'cooling' ? 100 - boundedProgress : 0;

    const bg = on 
      ? '#906747'
      : 'var(--card-background-color)';

    const fillColor = on ? '#68b4c5' : '#513726';
    const baseColor =  on ? '#513726' : '#110C07';

    return `

      .bubble-button-background {
        background: ${bg} !important;
      }

      .bubble-icon-container {
        border-radius: 50% !important;
        overflow: hidden !important;
        background: linear-gradient(
          to bottom,
          ${fillColor} ${fill}%,
          ${baseColor} ${fill}%
        ) !important;
      }

      .bubble-icon {
        color: #f5eee6 !important;
      }

    `;
  })()}
