# Merge this mapping into the dashboard root (alongside views).
decluttering_templates:
  dynamic-person-card:
    default:
      - show_name: false
      - away_color: "#8C8780"
      - top_buttons: []
      - bottom_buttons: []
    card:
      type: custom:stack-in-card
      mode: vertical
      card_mod:
        style: |
          ha-card {
            {% set colors = [[state_colors]] %}

            background-color: {{ colors.get(states('[[person_entity]]'), '[[away_color]]') }};
            background-image: radial-gradient(circle, transparent 42%, rgba(0,0,0,0.3) 42%, rgba(75,75,75,0.25) 100%);
            --primary-text-color: white;
            --secondary-text-color: rgba(255, 255, 255, 0.7);
          }
      cards:
        - type: custom:bubble-card
          card_type: sub-buttons
          hide_main_background: true
          card_mod:
            style: |
              .bubble-sub-button-group  {
                justify-content: space-between!important;
              }
              .bubble-sub-button {
                background: transparent !important;
              }
              .bubble-sub-button ha-icon {
                background: rgba(0, 0, 0, 0.6);
                border-radius: 50%;
                padding: 6px;
                box-sizing: content-box;
              }
          sub_button:
            bottom: "[[top_buttons]]"
          rows: 0.922
        - type: custom:mushroom-template-card
          entity: "[[person_entity]]"
          layout: vertical
          primary: >-
            {% if [[show_name]] %}[[display_name]]{% endif %}
          picture: >-
            {% set pics = {
              'home': '[[home_avatar]]',
              '[[work_zone]]': '[[work_avatar]]'
            } %} {{ pics.get(states('[[person_entity]]'), '[[away_avatar]]')
            }}
          card_mod:
            style:
              ha-tile-icon$: |
                .container {
                  width: 100% !important;
                  height: auto !important;
                  aspect-ratio: 1 / 1;
                }

                ::slotted(img) {
                  width: 100% !important;
                  height: auto !important;
                  object-fit: contain !important;
                }
              .: |
                ha-card {
                  background: transparent !important;
                  border: none !important;
                  margin-top: -1.6rem;
                  margin-bottom: -1.6rem;
                }
                ha-tile-icon {
                  width: 80% !important;
                  height: auto !important;
                  aspect-ratio: 1 / 1;
                }
          tap_action:
            action: more-info
        - type: custom:bubble-card
          card_type: sub-buttons
          hide_main_background: true
          card_mod:
            style: |
              .bubble-sub-button-group  {
                justify-content: space-between!important;
              }
              .bubble-sub-button {
                background: transparent !important;
              }
              .bubble-sub-button ha-icon {
                background: rgba(0, 0, 0, 0.6);
                border-radius: 50%;
                padding: 6px;
                box-sizing: content-box;
              }
          sub_button:
            bottom: "[[bottom_buttons]]"
          rows: 0.922
